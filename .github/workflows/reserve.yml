name: Reserve Tennis Court

on:
  schedule:
    # 04:00 UTC ≈ midnight ET (23:00 ET during daylight saving).
    # BEST GUESS — confirm the real slot-release rollover time against the
    # live site before relying on this, then adjust. See bot/README.md.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      facility_name:
        description: "Facility name (blank = use saved config)"
        required: false
      facility_id:
        description: "Facility ID (blank = use saved config)"
        required: false
      date:
        description: "Target date YYYY-MM-DD (blank = daysInAdvance from saved config)"
        required: false
      time:
        description: "Preferred time HH:mm (blank = use saved config)"
        required: false
      duration:
        description: "Duration in minutes (blank = use saved config)"
        required: false

permissions:
  contents: write

concurrency:
  group: reserve-tennis-court
  cancel-in-progress: false

jobs:
  reserve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install bot dependencies
        working-directory: bot
        run: npm ci

      - name: Install Playwright browser
        working-directory: bot
        run: npx playwright install --with-deps chromium

      - name: Run reservation attempt
        working-directory: bot
        env:
          NYCGOVPARKS_USERNAME: ${{ secrets.NYCGOVPARKS_USERNAME }}
          NYCGOVPARKS_PASSWORD: ${{ secrets.NYCGOVPARKS_PASSWORD }}
          FACILITY_NAME_OVERRIDE: ${{ github.event.inputs.facility_name }}
          FACILITY_ID_OVERRIDE: ${{ github.event.inputs.facility_id }}
          DATE_OVERRIDE: ${{ github.event.inputs.date }}
          TIME_OVERRIDE: ${{ github.event.inputs.time }}
          DURATION_OVERRIDE: ${{ github.event.inputs.duration }}
        run: npm run reserve

      - name: Upload failure screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-artifacts-${{ github.run_id }}
          path: bot/artifacts/**
          if-no-files-found: ignore

      - name: Commit updated history
        if: always()
        run: |
          git config user.name "tennis-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet || git commit -m "Update booking history [skip ci]"
          git push
